name: customfit_ai_flutter_sdk
description: Flutter SDK for CustomFit.ai feature flags, A/B testing, and analytics. Real-time config updates with offline support and cross-platform compatibility.
version: 0.1.5
homepage: https://customfit.ai
repository: https://github.com/customfit-ai-tech/customfit-ai-flutter-sdk
issue_tracker: https://github.com/customfit-ai-tech/customfit-ai-flutter-sdk/issues
documentation: https://doc.customfit.ai

topics:
  - feature-flags
  - ab-testing
  - analytics
  - configuration
  - remote-config

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  dio: ^5.9.0
  battery_plus: ^7.0.0
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  synchronized: ^3.4.0
  path_provider: ^2.1.5
  # Security-related dependencies for open source readiness
  dart_jsonwebtoken: ^3.3.1
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.7

  meta: ^1.16.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.2
  mockito: ^5.6.1
  args: ^2.7.0
  yaml: ^3.1.2
  path: ^1.9.1
  fake_async: ^1.3.3
  path_provider_platform_interface: ^2.1.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
